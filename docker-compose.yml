# 小倆口自架伺服器：PostgreSQL 資料庫 + API 伺服器，資料存在這台電腦的 Docker volume。
# 啟動：docker compose up -d      停止：docker compose down
name: xiaoliangkou

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xlk
      # 第一次啟動前可以在 .env 改掉（只用英文和數字）；資料庫建立後再改需要另外處理
      POSTGRES_PASSWORD: ${DB_PASSWORD:-xiaoliangkou}
      POSTGRES_DB: xiaoliangkou
      TZ: Asia/Taipei
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # 只開放給這台電腦本身，方便用 pgAdmin / DBeaver 查看；手機連不到資料庫
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xlk -d xiaoliangkou"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://xlk:${DB_PASSWORD:-xiaoliangkou}@db:5432/xiaoliangkou
      SECRET_FILE: /data/app-secret
      MAX_USERS: ${MAX_USERS:-2}
      TZ: Asia/Taipei
      IN_DOCKER: "1"
    volumes:
      - server-data:/data
    ports:
      - "${PORT:-8080}:8080"

volumes:
  db-data:
  server-data:
